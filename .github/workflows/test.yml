name: FrameLark checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node test/platform-install-check.mjs
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: docker compose -p frameyn-ci up -d --build --wait --wait-timeout 120
      - name: Check the complete studio
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='http://localhost:3177';
          for(const file of ['/','/app.js','/assets/alpine-demo.png','/assets/vision-probe.png']){
            const response=await fetch(base+file);
            assert.equal(response.status,200,file);
            await response.arrayBuffer();
          }
          const status=await(await fetch(base+'/api/status')).json();
          assert.equal(status.aiAvailable,false);
          assert.equal(status.connectionStatus,'unconfigured');
          console.log('Container serves the complete studio without a model key.');
          JS
      - if: always()
        run: docker compose -p frameyn-ci down --volumes
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run architecture:check
      - run: npm run plugin:check
      - run: npm run plugin:check:photography-eye
      - run: npm run engine:check
      - run: npm run test:web
      - run: npm install --global agent-browser@0.38.1
      - run: agent-browser install --with-deps
      - run: npm run test:website
      - run: npm run test:navigation
      - run: npm run setup
      - run: npm run test:collaboration
      - run: npm run test:collections
      - run: npm run test:exports
      - run: npm run test:edit-stack
      - run: npm run test:inspector-ux
      - run: npm run test:shared-retouch-ui
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run setup
      - run: npm run knowledge:check
      - run: npm run photography-eye:check
      - run: npm run test:skill
      - run: npm run setup:raw
      - run: node test/raw-backends-check.mjs
  raw-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run setup
      - run: npm run setup:raw
      - name: Download checksum-bound public Nikon fixture
        run: |
          curl --fail --location --output /tmp/framelark-camera.NEF https://raw.githubusercontent.com/letmaik/rawpy/main/test/iss030e122639.NEF
          node --input-type=module -e "import {readFile} from 'node:fs/promises';import {createHash} from 'node:crypto';import assert from 'node:assert/strict';assert.equal(createHash('sha256').update(await readFile('/tmp/framelark-camera.NEF')).digest('hex'),'5922721d13f11795557d97fdeb0a60b900086c402bc82a848ff280d15b99ffd4')"
      - run: node test/raw-backends-check.mjs /tmp/framelark-camera.NEF
